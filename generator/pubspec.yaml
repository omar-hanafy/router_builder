name: router_builder_generator
description: Build-time code generator for router_builder. Emits typed routes and deep-link matching from @RT annotations.
version: 4.0.0
homepage: https://github.com/omar-hanafy/router_builder
repository: https://github.com/omar-hanafy/router_builder
issue_tracker: https://github.com/omar-hanafy/router_builder/issues
documentation: https://github.com/omar-hanafy/router_builder#readme
topics:
  - flutter
  - navigation
  - routing
  - code-generation
  - build-runner

environment:
  sdk: ^3.11.0

# The generator resolves its analysis and build tools independently of Flutter.
dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  build: '>=4.0.6 <6.0.0'
  # dart_style 3.1.9 added support for analyzer 13.
  dart_style: '>=3.1.9 <4.0.0'
  glob: ^2.1.3

dev_dependencies:
  build_config: ^1.3.0
  build_test: ^3.5.15
  lints: ^6.0.0
  test: ^1.31.2
