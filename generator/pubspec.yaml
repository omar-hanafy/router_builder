name: router_builder_generator
description: Build-time code generator for router_builder. Emits typed routes and deep-link matching from @RT annotations.
version: 4.0.0
homepage: https://github.com/omar-hanafy/router_builder
repository: https://github.com/omar-hanafy/router_builder
issue_tracker: https://github.com/omar-hanafy/router_builder/issues
documentation: https://github.com/omar-hanafy/router_builder#readme
topics:
  - flutter
  - navigation
  - routing
  - code-generation
  - build-runner

environment:
  sdk: ^3.7.0

# Pure Dart on purpose: no `flutter` dependency. A Flutter dependency would pull
# the SDK's exact `meta` pin into this package's resolution and cap `analyzer`
# below 13.1.0, which is exactly the blocking this package exists to avoid.
dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  build: ^4.0.6
  # 3.1.8 and earlier require `analyzer ^12.0.0` and can never co-resolve with
  # the analyzer floor above.
  dart_style: '>=3.1.9 <4.0.0'
  glob: ^2.1.3

dev_dependencies:
  build_test: ^3.5.15
  lints: ^6.0.0
  # 1.31.1 and earlier fail to launch on the Dart SDK bundled with current
  # Flutter stable (missing frontend_server snapshot). Dev-only, so this floor
  # has no effect on consumers.
  test: ^1.31.2
