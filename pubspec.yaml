name: router_builder
description: Declarative Flutter navigation and deep link generator with typed routes.
version: 2.0.1
homepage: https://github.com/omar-hanafy/router_builder
repository: https://github.com/omar-hanafy/router_builder
issue_tracker: https://github.com/omar-hanafy/router_builder/issues
documentation: https://github.com/omar-hanafy/router_builder#readme
topics:
  - flutter
  - navigation
  - routing
  - code-generation
  - deep-linking

environment:
  sdk: ^3.7.0

dependencies:
  analyzer: ^8.4.0
  build: ^4.0.2
  dart_helper_utils: ^5.4.0
  dart_style: ^3.1.2
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  glob: ^2.1.3
  source_gen: ^4.0.2

dev_dependencies:
  build_runner: ^2.10.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
