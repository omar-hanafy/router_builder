name: route_generator
description: Declarative Flutter navigation and deep link generator with typed routes.
version: 1.0.0
homepage: https://github.com/omar-hanafy/route_generator
repository: https://github.com/omar-hanafy/route_generator
issue_tracker: https://github.com/omar-hanafy/route_generator/issues
documentation: https://github.com/omar-hanafy/route_generator#readme
topics:
  - flutter
  - navigation
  - routing
  - code-generation
  - deep-linking

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  source_gen: ^2.0.0
  build: ^2.5.4
  analyzer: ^7.4.5
  glob: ^2.1.3
  dart_helper_utils: ^5.2.0
  dart_style: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
