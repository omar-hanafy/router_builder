name: router_builder
description: Declarative Flutter navigation and deep link generator with typed routes.
version: 4.0.0
homepage: https://github.com/omar-hanafy/router_builder
repository: https://github.com/omar-hanafy/router_builder
issue_tracker: https://github.com/omar-hanafy/router_builder/issues
documentation: https://github.com/omar-hanafy/router_builder#readme
topics:
  - flutter
  - navigation
  - routing
  - code-generation
  - deep-linking

environment:
  sdk: ^3.7.0

# Runtime only. The code generator lives in the separate `router_builder_generator`
# package so that analyzer/build/dart_style never enter a consumer's dependency
# graph — they would otherwise cap the versions an app can resolve.
dependencies:
  dart_helper_utils: '>=6.0.0 <7.0.0'
  equatable: ^2.0.8
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
