name: router_builder_example
description: Example app demonstrating router_builder v3.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  router_builder:
    path: ../

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Build-time only. Keeping the generator out of `dependencies` is what keeps
  # analyzer/build/dart_style out of an app's production dependency graph.
  #
  # Declared as a hosted version so this example still resolves inside the
  # published router_builder archive (which does not carry ../generator).
  # Local development uses the sibling package via pubspec_overrides.yaml.
  router_builder_generator: ^4.0.0
