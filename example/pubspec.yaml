name: router_builder_example
description: Flutter example for typed routes and deep links with router_builder.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  router_builder:
    path: ../

dev_dependencies:
  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Use the public split revision until the first hosted generator is available.
  # Local development resolves the sibling package via pubspec_overrides.yaml.
  router_builder_generator:
    version: ^4.0.0
    git:
      url: https://github.com/omar-hanafy/router_builder
      ref: 70751510b4413966c3343ec691264fd848680a25
      path: generator
